name: Claude Review

on:
  pull_request:
    # synchronize は含めない（docs/pr-review-automation.md 6.2 参照）
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  auto-review:
    # Draft / dependabot / fork PR はスキップ（6.5 参照）
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment がないとプラグインは PR に何も投稿しない（16.1 / 12.2 No.1）
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          # track_progress と --allowedTools は意図的に設定しない（4.2 参照）
          claude_args: |
            --max-turns 30
            --append-system-prompt "GitHub に投稿するレビューコメントは、総評・インラインコメントともにすべて日本語で記述する。ファイル名・識別子・コード片・CLAUDE.md からの引用は原文のまま扱う。"

  mention:
    # コメント本文に @claude を含む場合のみ発火
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-mention-${{ github.event.comment.id || github.event.review.id }}
      cancel-in-progress: false
    permissions:
      # contents: write は意図的に与えない（6.3 参照）
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # auto-review と違いプラグインを通さないため、ツールをここで明示的に制限する。
          # Claude App のトークンは workflows / repository hooks への write を含むが、
          # gh api を許可しないことで実行経路を塞ぐ（9章参照）
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "回答は日本語で行う。ファイル名・識別子・コード片は原文のまま引用する。コードの変更は行わず、方針の説明と該当箇所の提示に留める。"
